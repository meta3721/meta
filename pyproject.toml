[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-mcs"
version = "0.4.0"
description = "RAVEN-MCS: Target-Risk-Calibrated Asynchronous Federated Data Completion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Research / All rights reserved" }
authors = [{ name = "RAVEN-MCS Experiment Team" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "hydra-core>=1.3",
  "scikit-learn>=1.3",
  "pytest>=7.4",
  "cvxpy>=1.4",
  "clarabel>=0.7",
]

[project.optional-dependencies]
solver = ["cvxpy>=1.4", "clarabel>=0.7"]
torch = ["torch>=2.1"]
full = [
  "raven-mcs[solver,torch]",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
]

[project.scripts]
raven-verify = "raven_mcs.cli_verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.raven_mcs]
official_python = "3.11"
constitution_version = "V2.3"
workspace_root_hint = "D:\\Cursor\\raven.mcs"
